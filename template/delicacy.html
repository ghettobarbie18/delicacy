<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delicacy Template</title>

<style>
.hover-template {
    width: 600px;
    height: 700px;
    margin: 40px auto;
    position: relative;
    overflow: hidden;
    box-shadow:
    0 0 10px #ec6666,
    0 0 30px #800000,
    10px 10px 10px rgba(0,0,0,.7);
}
    
.hover-template::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 3px;
    background: linear-gradient(
        135deg,
        #3c1516,
        #b97176,
        #7f2c32,
        #9d1b22

    );
    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;

}

.hover-title {
    margin: 0 0 15px;
    font-size: 40px;
    font-family: Georgia, serif;
    color: #fff;
    text-align: center;
    text-shadow: 0 0 10px #ff00ff;
}

.hover-quote {
    margin: 0;
    max-width: 450px;
    font-size: 18px;
    font-family: Georgia, serif;
    font-style: italic;
    color: #fff;
    text-align: center;
    line-height: 1.5;
}

.hover-image {
    width: 100%;
    height: 100%;
    background: url("https://raw.githubusercontent.com/ghettobarbie18/delicacy/refs/heads/main/val.jpg") center / cover no-repeat;
    transition: .5s ease;
}

.hover-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px;
    background: rgba(0,0,0,.7);
    color: #fff;
    opacity: 0;
    transition: .5s ease;
}

.hover-template:hover .hover-content {
    opacity: 1;
}

.hover-template:hover .hover-image {
    transform: scale(1.08);
}

.hover-template:hover {
    border-color: #900;
    box-shadow: 0 0 25px rgba(150,0,0,.7);
}

.hover-title {
    font-size: 40px;
    text-shadow: 0 0 15px #900;
}
</style>
</head>

<body>

<div class="hover-template">

    <div class="hover-image"></div>

    <div class="hover-content">
        <h1 class="hover-title">Valak Mortem</h1>

        <p class="hover-quote">
            "Your quote goes here."
        </p>
        <div class="hover-title">TITLE</div>
        <div class="hover-text">YOUR TEXT HERE</div>
    </div>

</div>

</body>
</html>
