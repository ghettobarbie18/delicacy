<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delicacy Template</title>

<style>
.hover-template {
    width: 600px;
    height: 700px;
    margin: 40px auto;
    position: relative;
    overflow: hidden;
    background: #111;
    border: 1px solid #ff0000;
    
    ::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 2px;
    background: linear-gradient(
        135deg,
        #8b0000,
        #d4af37,
        #8b0000
    );
    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;

}

.hover-image {
    width: 100%;
    height: 100%;
    background: url("https://raw.githubusercontent.com/ghettobarbie18/delicacy/refs/heads/main/val.jpg") center / cover no-repeat;
    transition: .5s ease;
}

.hover-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px;
    background: rgba(0,0,0,.7);
    color: #fff;
    opacity: 0;
    transition: .5s ease;
}

.hover-template:hover .hover-content {
    opacity: 1;
}

.hover-template:hover .hover-image {
    transform: scale(1.08);
}

.hover-template:hover {
    border-color: #900;
    box-shadow: 0 0 25px rgba(150,0,0,.7);
}

.hover-title {
    font-size: 40px;
    text-shadow: 0 0 15px #900;
}
</style>
</head>

<body>

<div class="hover-template">

    <div class="hover-image"></div>

    <div class="hover-content">
        <div class="hover-title">TITLE</div>
        <div class="hover-text">YOUR TEXT HERE</div>
    </div>

</div>

</body>
</html>
