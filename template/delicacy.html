<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Island+Moments&family=Metal+Mania&family=Caudex&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delicacy Template</title>

<style>
.hover-template {
    width: 600px;
    height: 700px;
    margin: 40px auto;
    position: relative;
    overflow: hidden;
}
    
.hover-template::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 3px;
    background: linear-gradient(
        135deg,
        #3c1516,
        #b97176,
        #7f2c32,
        #9d1b22

    );
    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    box-shadow:
    0 0 10px #ec6666,
    0 0 30px #800000,
    10px 10px 10px rgba(0,0,0,.7);
}

.hover-image {
    width: 100%;
    height: 100%;
    background: url("https://raw.githubusercontent.com/ghettobarbie18/delicacy/refs/heads/main/val.jpg") center / cover no-repeat;
    transition: .5s ease;
}

.hover-content {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 15px 15px 30px 20px;;
    background: rgba(0,0,0,.7);
    color: #fff;
    opacity: 0;
    transition: .5s ease;
}

.hover-template:hover .hover-content {
    opacity: 1;
}

.hover-text {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
    padding: 20px;
    color: #fff;
    text-align: left;
    pointer-events: none;
}

.hover-title {
    position: relative;
    left: 10px;
    top: 0;
    margin-bottom: 0;
    font-size: 70px !important;
    font-family: "Island Moments", cursive;
    font-weight: 400;
    font-style: normal;
    letter-spacing: 8px !important;
    color: #330000;
    background: linear-gradient(to right, #e666ff, #c400cc, #880099, #2f021b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.hover-quote {
    position: relative;
    top: 0;
    left: 15px;
    max-width: 550px;
    margin-bottom: 3px;
    font-size: 11px;
    font-family: "Caudex", serif;
    font-weight: 400;
    font-style: italic;
    text-transform: uppercase;
    line-height: 1.2;
}

.hover-quote2 {
    position: relative;
    top: 0;
    left: 50px;
    max-width: 550px;
    margin-top: 0;
    font-size: 20px;
    font-family: "Metal Mania", system-ui;
    font-weight: 400;
    font-style: normal;
    color: black;
    text-shadow:
        0 0 5px #800000,
        0 0 5px #960018,
        0 0 5px #a70000,
        0 0 5px #d10000;
    line-height: 1.2;
}

.special-font {
    font-family: "Metal Mania", cursive;
    font-size: 18px;
    color: #f9232c;
}

.hover-template:hover .hover-content {
    opacity: 1;
}

.hover-template:hover .hover-image {
    transform: scale(1.08);
}

.hover-template:hover {
    border-color: #900;
    box-shadow: 0 0 25px rgba(150,0,0,.7);
}

.hover-title {
    font-size: 40px;
    text-shadow: 0 0 15px #900;
}
</style>
</head>

<body>

<div class="hover-template">

    <div class="hover-image"></div>

    <div class="hover-text">
        <div class="hover-text">
    <div class="hover-title neon">Valak Mortem</div>
    <div class="hover-quote">she had this look in her eyes that made you wonder just how many people she has killed</div>
    <div class="hover-quote2">and this grin that made you realize, she has probably lost count</div>
</div>

    <div class="hover-content">
        <p>Your hidden text goes here.</p>
    </div>

</div>

</body>
</html>
