<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delicacy Template</title>

<style>
.hover-template {
    width: 600px;
    height: 700px;
    margin: 40px auto;
    position: relative;
    overflow: hidden;
}
    
.hover-template::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 3px;
    background: linear-gradient(
        135deg,
        #3c1516,
        #b97176,
        #7f2c32,
        #9d1b22

    );
    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    box-shadow:
    0 0 10px #ec6666,
    0 0 30px #800000,
    10px 10px 10px rgba(0,0,0,.7);
}

.hover-image {
    width: 100%;
    height: 100%;
    background: url("https://raw.githubusercontent.com/ghettobarbie18/delicacy/refs/heads/main/val.jpg") center / cover no-repeat;
    transition: .5s ease;
}

.hover-content {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px;
    background: rgba(0,0,0,.7);
    color: #fff;
    opacity: 0;
    transition: .5s ease;
}

.hover-template:hover .hover-content {
    opacity: 1;
}

.hover-text {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding: 15px 15px 30px;
    color: #fff;
    text-align: center;
    pointer-events: none;
}

.hover-title {
    margin: -50 0 8px;
    font-size: 40px;
    font-family: Georgia, serif;
    color: #b97176;
    background: linear-gradient( to right, #e666ff, #c400cc, #880099 ); 
    -webkit-background-clip: text; 
    -webkit-text-fill-color: transparent;
}

.hover-quote {
    margin: -30 0 8px;
    max-width: 450px;
    font-size: 12px;
    font-family: Georgia, serif;
    font-style: italic;
    line-height: 1.5;
}

.hover-quote2 {
    margin: 0;
    max-width: 450px;
    font-size: 16px;
    font-family: "Brush Script MT", cursive;
    font-style: normal;
    color: #e666ff;
    text-shadow:
        0 0 5px #e666ff,
        0 0 10px #bc1e85,
        0 0 20px #9d1b22,
        0 0 30px #7f2c32;
    line-height: 1.3;
}

.hover-template:hover .hover-content {
    opacity: 1;
}

.hover-template:hover .hover-image {
    transform: scale(1.08);
}

.hover-template:hover {
    border-color: #900;
    box-shadow: 0 0 25px rgba(150,0,0,.7);
}

.hover-title {
    font-size: 40px;
    text-shadow: 0 0 15px #900;
}
</style>
</head>

<body>

<div class="hover-template">

    <div class="hover-image"></div>

    <div class="hover-text">
    <h1 class="hover-title neon">Valak Mortem</h1>
    <p class="hover-quote">she had this look in her eyes that made you wonder just how many people she has killed</p>
    <p class="hover-quote2">and this grin that made you realize, she has probably lost count</p>
</div>

    <div class="hover-content">
        <p>Your hidden text goes here.</p>
    </div>

</div>

</body>
</html>
